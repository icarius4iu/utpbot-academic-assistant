# ============================================================================
# UTPBot Backend (Quarkus) — configuración
# Ver plan de migración: /home/codespace/.claude/plans/bright-doodling-twilight.md
# ============================================================================

quarkus.application.name=utpbot-backend
quarkus.http.port=8080

# El frontend habla snake_case (codigo_usuario, idioma_preferido, file_name, ...) — igual
# que Pydantic/FastAPI lo generaba. Con esto, los DTOs Java se escriben en camelCase
# normal (fileName) y Jackson los serializa/deserializa como file_name automáticamente,
# sin @JsonProperty repetido en cada campo.
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# ----------------------------------------------------------------------------
# Base de datos (Supabase PostgreSQL)
# ----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# En %dev y %test NO se fija jdbc.url a propósito: así Quarkus Dev Services levanta
# solo un contenedor Postgres descartable (vía Docker/Testcontainers) para cada corrida
# de `quarkus:dev` o `mvn test` — nada que instalar ni configurar a mano. Flyway aplica
# el esquema automáticamente contra ese contenedor. En producción SÍ es obligatorio.
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

# Hibernate NO gestiona el esquema — Flyway es la única fuente de verdad (V1__init_schema.sql)
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ----------------------------------------------------------------------------
# Firebase Admin SDK (custom tokens + verificación de ID tokens — ver security/)
# GOOGLE_APPLICATION_CREDENTIALS_JSON: el JSON completo de la service account, como
# variable de entorno de una sola línea (igual patrón que GOOGLE_CREDENTIALS_JSON en
# el backend Python actual, para reusar el mismo hábito operativo en Railway).
# ----------------------------------------------------------------------------
firebase.credentials.json=${GOOGLE_APPLICATION_CREDENTIALS_JSON:}
firebase.project.id=${FIREBASE_PROJECT_ID:}

# ----------------------------------------------------------------------------
# Gemini AI
# ----------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-pro}

# ----------------------------------------------------------------------------
# Admin (cuenta única compartida — igual diseño que el backend Python actual)
# ADMIN_PASSWORD_HASH: bcrypt de la contraseña, generado una vez con BcryptUtil.
# ----------------------------------------------------------------------------
admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH:}

# ----------------------------------------------------------------------------
# Telegram Bot
# ----------------------------------------------------------------------------
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.webhook-url=${TELEGRAM_WEBHOOK_URL:}
telegram.notifications-chat-id=${TELEGRAM_NOTIFICATIONS_CHAT_ID:}

# ----------------------------------------------------------------------------
# Google Calendar (cuenta de servicio — mismas credenciales que Firebase/Sheets)
# ----------------------------------------------------------------------------
google.calendar.id=${GOOGLE_CALENDAR_ID:primary}

# ----------------------------------------------------------------------------
# CORS — replicado tal cual del backend Python actual (allow_origins=["*"],
# allow_credentials=false) por decisión explícita del usuario. Ver plan §Auth.
# ----------------------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
# Bypass-Tunnel-Reminder: header sobrante que script.js todavía manda (venía de una
# herramienta de túnel usada en el desarrollo original en Python) — sin permitirlo acá
# el navegador bloquea la request entera por política CORS, aunque el preflight en sí
# devuelva 200. Descubierto en vivo probando el login real desde un GitHub Codespace.
quarkus.http.cors.headers=Authorization,Content-Type,Bypass-Tunnel-Reminder
quarkus.http.cors.access-control-allow-credentials=false

# ----------------------------------------------------------------------------
# OpenAPI/Swagger — solo en dev, igual que /docs y /redoc en el backend Python
# ----------------------------------------------------------------------------
quarkus.swagger-ui.always-include=false

# ----------------------------------------------------------------------------
# Rate limiting (ver filter/RateLimitFilter) — límites idénticos a slowapi hoy:
# 200/hora global, 30/min por IP.
# ----------------------------------------------------------------------------
ratelimit.per-minute=30
ratelimit.per-hour=200

# ----------------------------------------------------------------------------
# app.debug — equivalente directo a la variable DEBUG del backend Python (main.py):
# activa HSTS solo cuando es "false", habilita Swagger, sube verbosidad de logs.
# ----------------------------------------------------------------------------
app.debug=${DEBUG:false}

# ----------------------------------------------------------------------------
# Perfil de desarrollo
# ----------------------------------------------------------------------------
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.utpbot".level=DEBUG
# Sin jdbc.url explícito aquí a propósito — ver comentario en la sección de datasource.

# ----------------------------------------------------------------------------
# Perfil de producción
# ----------------------------------------------------------------------------
%prod.quarkus.log.level=INFO
%prod.quarkus.log.category."com.utpbot".level=INFO
%prod.quarkus.http.limits.max-body-size=15M
